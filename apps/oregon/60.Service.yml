apiVersion: v1
kind: Service
metadata:
  name: oregon
  namespace: oregon
  labels:
    app.kubernetes.io/component: oregon
    app.kubernetes.io/name: oregon
    prometheus.monitoring/service: nginx-exporter
spec:
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: oregon
    - name: metrics
      protocol: TCP
      port: 9118
      targetPort: metrics
  selector:
    app.kubernetes.io/component: oregon
    app.kubernetes.io/name: oregon
  sessionAffinity: None
  type: ClusterIP
