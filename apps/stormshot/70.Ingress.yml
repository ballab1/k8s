apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stormshot-ingress
  namespace: stormshot
  labels:
    app.kubernetes.io/component: ingress
    app.kubernetes.io/name: nginx-ingress-microk8s
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Access-Control-Allow-Origin https://web.prod.k8s.home always;
    prometheus.io/port: '9113'
    spec.ingressClassName: public
spec:
  rules:
  - host: stormshot.prod.k8s.home
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: stormshot
              port:
                number: 80
