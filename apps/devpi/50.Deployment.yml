kind: Deployment
apiVersion: apps/v1
metadata:
  name: devpi
  namespace: devpi
  labels:
    app.kubernetes.io/component: devpi
    app.kubernetes.io/name: devpi
  annotations:
    deployment.kubernetes.io/revision: '1'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: devpi
      app.kubernetes.io/name: devpi
  template:
    metadata:
      labels:
        app.kubernetes.io/component: devpi
        app.kubernetes.io/name: devpi
    spec:
      volumes:
        - name: devpi-data
          persistentVolumeClaim:
            claimName: pvc-devpi
            readOnly: false
      containers:
        - name: devpi
          image:  registry.ubuntu.home/docker.io/muccg/devpi:4.5.1
          env:
            - name: DEVPI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devpi
                  key: password
          ports:
            - name: devpi
              containerPort: 3141
              protocol: TCP
          volumeMounts:
            - name: devpi-data
              mountPath: /data
              readOnly: false
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/hostname: s8.ubuntu.home
      serviceAccountName: devpi
      serviceAccount: devpi
      schedulerName: default-scheduler
  hostAliases:
    - ip: 10.3.1.15
      hostnames:
        - s8.ubuntu.home
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
