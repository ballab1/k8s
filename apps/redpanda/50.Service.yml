kind: Service
apiVersion: v1
metadata:
  name: redpanda
  namespace: redpanda
  labels:
    app.kubernetes.io/component: redpanda
    app.kubernetes.io/name: redpanda
spec:
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: redpanda
  selector:
    app.kubernetes.io/component: redpanda
    app.kubernetes.io/name: redpanda
  sessionAffinity: None
  type: ClusterIP
