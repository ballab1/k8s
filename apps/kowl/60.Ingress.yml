apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kowl-ingress
  namespace: kowl
  labels:
    app.kubernetes.io/component: ingress
    app.kubernetes.io/name: nginx-ingress-microk8s
  annotations:
    prometheus.io/port: "9113"
    spec.ingressClassName: public
spec:
  rules:
  - host: prod.k8s.home
    http:
      paths:
        - path: /kowl
          pathType: Prefix
          backend:
            service:
              name: kowl
              port:
                number: 80
