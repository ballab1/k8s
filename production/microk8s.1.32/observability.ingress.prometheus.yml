apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-k8s-ingress
  namespace: observability
  labels:
    app.kubernetes.io/component: ingress
    app.kubernetes.io/name: nginx-ingress-microk8s
  annotations:
    prometheus.io/port: "9113"
    spec.ingressClassName: public
spec:
  ingressClassName: public
  rules:
  - host: prometheus.prod.k8s.home
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: kube-prom-stack-kube-prome-prometheus
              port:
                number: 9090